[package]
name = "terminal-clock"
version = "0.1.0"
edition = "2024"
description = "A configurable terminal clock, countdown timer, and stopwatch"
license = "MIT"

[dependencies]
chrono = "0.4"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

tempfile = "3"
shlex = "1"
