name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - name: Validate release version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag in vX.Y.Z format: $RELEASE_TAG" >&2
            exit 1
          fi
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "terminal-clock"))')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          echo "PACKAGE_NAME=terminal-clock-$RELEASE_TAG-$TARGET" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Package release
        run: |
          staging=$(mktemp -d)
          mkdir -p "$staging/$PACKAGE_NAME" dist
          install -m 755 "target/$TARGET/release/terminal-clock" "$staging/$PACKAGE_NAME/terminal-clock"
          cp README.md LICENSE config.example.toml "$staging/$PACKAGE_NAME/"
          tar -czf "dist/$PACKAGE_NAME.tar.gz" -C "$staging" "$PACKAGE_NAME"
          cd dist
          sha256sum "$PACKAGE_NAME.tar.gz" > SHA256SUMS

      - name: Verify release package
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          extracted=$(mktemp -d)
          tar -xzf "$PACKAGE_NAME.tar.gz" -C "$extracted"
          binary="$extracted/$PACKAGE_NAME/terminal-clock"
          "$binary" --help
          actual_version=$("$binary" --version)
          expected_version="terminal-clock ${RELEASE_TAG#v}"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Expected '$expected_version', got '$actual_version'" >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/$PACKAGE_NAME.tar.gz" dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
